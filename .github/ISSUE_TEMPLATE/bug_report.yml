name: Bug report
description: Report a reproducible FileMailer problem without personal data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Do not include OAuth tokens, email content, addresses or private paths.
  - type: input
    id: version
    attributes:
      label: FileMailer version
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac architecture
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction with synthetic data
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual and expected result
    validations:
      required: true
